# Serve WebP automaticamente para browsers que suportam
map $http_accept $webp_suffix {
    default   "";
    "~*image/webp" ".webp";
}

# Detecta mobile por User-Agent — usado em location = / para servir o arquivo certo
map $http_user_agent $device {
    default  "desktop";
    "~*(?:android|webos|iphone|ipad|ipod|blackberry|iemobile|opera\s?mini)" "mobile";
}

# Rate limiting — usa X-Forwarded-For (Cloud Run passa o IP real do cliente aqui)
# Cloud Run appends the observed address; ignore client-supplied prefixes.
map $http_x_forwarded_for $client_rate_key {
    default $binary_remote_addr;
    "~(?<platform_client>[0-9a-fA-F:.]+)\\s*$" $platform_client;
}
limit_req_zone $client_rate_key zone=pompom:10m rate=20r/s;
# Independent ceiling per instance, not controlled by any request header.
limit_req_zone $server_name zone=site_total:1m rate=100r/s;

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;

    # Oculta versão do nginx
    server_tokens off;
    add_header_inherit merge;
    include /etc/nginx/security-headers.conf;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location ~ (^|/)\. { return 404; }
    location ~* ^/(backups|previews|scripts|node_modules)(/|$) { return 404; }
    location ~* ^/(Dockerfile|nginx\.conf|security-headers\.conf|package(-lock)?\.json|.*\.(pem|key|env))$ { return 404; }

    # Charset
    charset utf-8;

    # Limita body de requisições (site estático — nenhum upload esperado)
    client_max_body_size 16k;

    # Rate limiting — aplicado apenas em rotas HTML, não em assets estáticos
    # (imagens, fontes e CSS ficam sem limite — o mosaico carrega ~100 imgs de uma vez)
    limit_req_status 429;

    # IP real via Cloud Run (load balancer do Google)

    # ── Security Headers ────────────────────────────────────────────────────

    # Content Security Policy — cdn.tailwindcss.com removido (CSS agora é local)

    # HSTS — força HTTPS por 1 ano, inclui subdomínios, elegível para preload

    # Impede clickjacking (reforça frame-ancestors da CSP para clientes mais antigos)

    # Impede MIME-type sniffing

    # Controla informações de referência enviadas ao navegar para links externos

    # Bloqueia acesso a hardware desnecessário

    # Isola contexto de navegação — protege contra ataques Spectre cross-origin

    # Impede que outros sites leiam nossos recursos via fetch/XHR cross-origin

    # ── Roteamento de dispositivo ────────────────────────────────────────────

    # Redireciona /pagina.html → /pagina (301, clean URLs)
    location ~* ^(.+)\.html$ {
        return 301 $1$is_args$args;
    }

    # Raiz: serve desktop.html ou mobile.html internamente sem redirect HTTP
    location = / {
        limit_req zone=pompom burst=40 nodelay;
        limit_req zone=site_total burst=200 nodelay;
        try_files /$device.html =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ── Cache Control ────────────────────────────────────────────────────────

    # CSS gerado (Tailwind): cache de 1 dia — rebuilds frequentes em deploy
    location = /tailwind.css {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Imagens: serve WebP automaticamente se o browser suportar
    location ~* \.(jpg|jpeg|png|gif)$ {
        add_header Vary Accept;
        try_files $uri$webp_suffix $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fontes/SVG/WebP direto: cache longo
    location ~* \.(ico|svg|webp|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(js|css)$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache" always;
    }

    # Demais rotas: clean URL → serve $uri.html se existir
    location / {
        limit_req zone=pompom burst=40 nodelay;
        limit_req zone=site_total burst=200 nodelay;
        try_files $uri $uri/ $uri.html =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}
