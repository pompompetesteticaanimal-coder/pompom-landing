<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PomPom — Experimentos de vitrine e avaliações</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#17101f;color:#fff3df;font:14px/1.6 system-ui,sans-serif}main{max-width:560px;margin:auto;padding:24px 16px}a{color:#ffad66}h1{font:30px/1.15 Georgia,serif;margin:14px 0}p{color:#c7b7ce}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button,select{min-height:44px;border:1px solid #705079;border-radius:12px;background:#24192e;color:#fff3df;padding:8px 14px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#ffad66;color:#17101f}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #d0a5ea;outline-offset:4px}.notice{border-left:3px solid #ffad66;background:#24192e;padding:12px;border-radius:8px;font-size:12px}.stage{width:390px;max-width:100%;margin:20px auto;border:1px solid #48334f;border-radius:22px;overflow:hidden}iframe{width:100%;height:1000px;border:0;display:block;background:#17101f}label{display:block;margin-top:14px;color:#c7b7ce}select{width:100%;margin-top:6px}.sources{font-size:12px;margin-top:20px}.loading{color:#ffad66;min-height:24px;font-size:12px}
  </style>
<script src="/previews/natal/sugestoes/catalogo.js?v=37" defer></script><link rel="stylesheet" href="/previews/natal/central/navegacao.css?v=41"><script src="/previews/natal/central/navegacao.js?v=46" defer></script></head>
<body><main>
  <a href="layouts.html#vitrine">← Voltar à comparação</a>
  <h1 id="title">Experimento mobile</h1><p id="description"></p>
  <div class="notice" id="notice"></div>
  <div class="controls" id="variants" aria-label="Alternativas"></div>
  <label id="scenario-control" hidden>Teste a apresentação das avaliações
    <select id="scenario"><option value="all">Cenário simulado: todas com cinco estrelas</option><option value="mixed">Cenário simulado: também há uma avaliação de quatro estrelas</option><option value="offline">Google não conectado</option></select>
  </label>
  <div class="loading" id="status" role="status">Preparando a prévia…</div>
  <div class="stage"><iframe id="site" title="Protótipo mobile interativo PomPom" src="../../mobile.html?intro=off"></iframe></div>
  <div class="sources" id="sources" hidden>Conexão futura: <a href="https://developers.google.com/my-business/content/review-data" target="_blank" rel="noopener">API do Perfil da Empresa</a>. A <a href="https://developers.google.com/maps/documentation/places/web-service/reference/rest/v1/places" target="_blank" rel="noopener">Places API</a> retorna no máximo cinco avaliações, não o histórico completo. Nenhuma autenticação ou integração real foi realizada nesta prévia.</div>
</main>
<script>
  const params=new URLSearchParams(location.search);let part=params.get('parte')==='avaliacoes'?'avaliacoes':'vitrine';let variant=Math.max(1,Math.min(3,Number(params.get('opcao'))||1));let mode='all';
  const titles={vitrine:['Seu modelo, com duas linhas','Fotos em duas linhas','Duas linhas para deslizar'],avaliacoes:['Nota em destaque + depoimento','Carrossel de reconhecimento','Selo e distribuição das estrelas']};
  document.querySelector('#title').textContent=part==='vitrine'?'Uma entrada para a sua lojinha':'O carinho vira reconhecimento';
  document.querySelector('#description').textContent=part==='vitrine'?'A loja continua igual. Aqui mudamos só a vitrine que convida o cliente a entrar.':'Três formas de valorizar as avaliações, com a origem dos dados sempre clara.';
  document.querySelector('#notice').textContent=part==='vitrine'?'Toque no card para abrir a lojinha real do site. Fotos do catálogo atual; sem inventar preços ou estoque. Alterações apenas neste experimento.':'Prévia não conectada ao Google. Os números são cenários simulados; os depoimentos são os textos já presentes no site. “100%” se refere a avaliações de cinco estrelas no cenário completo, nunca a todos os atendimentos.';
  document.querySelector('#scenario-control').hidden=part!=='avaliacoes';document.querySelector('#sources').hidden=part!=='avaliacoes';
  const iframe=document.querySelector('#site');let attempts=0,resizeObserver;
  function buttons(){document.querySelector('#variants').replaceChildren(...titles[part].map((title,index)=>{const b=document.createElement('button');b.type='button';b.textContent=`${index+1} · ${title}`;b.setAttribute('aria-pressed',String(index+1===variant));b.onclick=()=>{variant=index+1;history.replaceState(null,'',`?parte=${part}&opcao=${variant}`);buttons();apply()};return b}))}buttons();
  function apply(){const win=iframe.contentWindow;if(!win?.PomPomExperimentos)return;win.PomPomExperimentos.render(part,variant,mode);document.querySelector('#status').textContent='Prévia pronta para testar.';iframe.dataset.ready='true';if(part==='avaliacoes'&&!resizeObserver){resizeObserver=new win.ResizeObserver(()=>{iframe.style.height=Math.max(950,Math.ceil(win.document.getElementById('experiment-section').getBoundingClientRect().height)+30)+'px'});resizeObserver.observe(win.document.getElementById('experiment-section'));}}
  function connect(){const doc=iframe.contentDocument;if(!doc?.querySelector('.product-scroll')||!doc.querySelector('.review-box')){if(++attempts<100)setTimeout(connect,100);else document.querySelector('#status').textContent='Não foi possível abrir o site local. Atualize a página.';return}if(doc.getElementById('experiment-script')){apply();return}const script=doc.createElement('script');script.id='experiment-script';script.src=new URL('experimentos.js',location.href).href;script.onload=apply;doc.body.append(script);}
  iframe.addEventListener('load',connect);connect();
  document.querySelector('#scenario').onchange=e=>{mode=e.target.value;apply()};
</script></body></html>
