<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Menu Mobile — Variante 1: Drawer Lateral Elegante (Side Sheet)</title>
<!-- Tailwind CSS CDN com plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Configurações personalizadas de fontes e temas -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            aubergine: {
              DEFAULT: '#17101f',
              card: '#24192e',
              surface: '#2b1f37',
              border: '#3c2b4d'
            },
            creme: {
              DEFAULT: '#fff3df',
              muted: '#d6c8b6'
            },
            pumpkin: {
              DEFAULT: '#ffad66',

            lavender: {
              DEFAULT: '#cfb8e8',

        }
      }

<!-- Estilos gerais e suporte a backdrop blur -->
<style data-purpose="custom-layout">
    body {
      background-color: #17101f;
      color: #fff3df;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    /* Scrollbar discreta para o drawer se necessário */
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #3c2b4d;
      border-radius: 4px;
    }

<body class="w-full min-h-screen bg-aubergine flex justify-center items-start overflow-x-hidden">

<div class="relative w-full max-w-[390px] min-h-[844px] bg-aubergine overflow-hidden shadow-2xl flex flex-col">
<!-- BEGIN: BackgroundUnderlay -->
<!-- Fundo de trás simulando a capa da PomPom Pet visualmente aberta atrás do backdrop -->
<div class="absolute inset-0 z-0 pointer-events-none filter blur-[1.5px] opacity-40">

</div>
<!-- END: BackgroundUnderlay -->
<!-- BEGIN: BackdropScrim -->

<svg class="w-full h-full" fill="none" stroke="currentColor" stroke-width="1.2" viewbox="0 0 100 100">

<path d="M70 0 A 30 30 0 0 0 100 30"></path>
</svg>

</span>

</div>

<svg class="w-5 h-5 text-creme" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">

<span class="text-sm font-medium tracking-wide">Lojinha Pet</span>

<svg class="w-4 h-4 text-lavender-soft opacity-60 group-hover:opacity-100 group-hover:translate-x-0.5 transition-all" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
